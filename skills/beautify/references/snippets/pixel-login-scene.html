<main class="pixel-login-scene beautify-root">
  <section class="pixel-login-world" aria-label="产品介绍">
    <div class="clouds-layer" aria-hidden="true">
      <span class="pixel-cloud c1"></span>
      <span class="pixel-cloud c2"></span>
      <span class="pixel-cloud c3"></span>
    </div>
    <div class="pixel-world-copy">
      <span class="pixel-kicker">PLAYER PORTAL</span>
      <h1>欢迎回来</h1>
      <p>在这里保留原产品名称、业务价值说明和必要帮助信息。</p>
    </div>
    <div class="pixel-world-stage" aria-hidden="true">
      <span class="pixel-tree left-tree"></span>
      <span class="pixel-hero-character"></span>
      <span class="pixel-tree right-tree"></span>
    </div>
    <div class="pixel-ground-bar" aria-hidden="true"></div>
  </section>

  <section class="pixel-login-panel-wrap">
    <div class="pixel-login-panel pixel-business-safe-zone">
      <header class="pixel-login-panel-header">
        <span class="pixel-kicker">CONTINUE QUEST</span>
        <h2>登录账号</h2>
        <p>把原登录页标题与说明放在这里。</p>
      </header>

      <form class="pixel-login-form">
        <!-- 将原项目的字段、校验、提交事件、id、name、data-* 与无障碍属性原样迁入此处。 -->
        <label>
          <span>账号</span>
          <input name="username" autocomplete="username" />
        </label>
        <label>
          <span>密码</span>
          <input name="password" type="password" autocomplete="current-password" />
        </label>
        <button class="btn primary" type="submit">进入系统</button>
      </form>
    </div>
  </section>
</main>
